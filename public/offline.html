<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pas de connexion</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f5f7f6; color: #1f2937; }
        .box { text-align: center; padding: 32px; max-width: 420px; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: #6b7280; margin: 0 0 20px; }
        button { border: 0; border-radius: 8px; padding: 10px 22px; font-size: 15px; background: #009e49; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <div style="font-size:42px">&#128268;</div>
    <h1>Pas de connexion internet</h1>
    <p>Vérifiez la connexion puis réessayez. / No internet connection: check it and try again.</p>
    <button onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
